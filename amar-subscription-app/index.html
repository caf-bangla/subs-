<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="সাবস্ক্রিপশন">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>আমার সাবস্ক্রিপশন</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--tx:#14161a;--mut:#6b7280;--line:#e6e8ec;--soft:#eef0f4;
  --acc:#4f46e5;--accTx:#fff;--red:#dc2626;--redBg:#fde8e8;--org:#c2410c;--orgBg:#ffedd5;
  --yel:#a16207;--yelBg:#fef3c7;--grn:#15803d;--grnBg:#dcfce7;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1115;--card:#1a1d23;--tx:#eef0f3;--mut:#9aa1ad;--line:#2a2e36;--soft:#23272f;
  --acc:#818cf8;--accTx:#0f1115;--red:#f87171;--redBg:#3b1717;--org:#fb923c;--orgBg:#3a2312;
  --yel:#facc15;--yelBg:#3a3110;--grn:#4ade80;--grnBg:#12301d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:-apple-system,"Bangla Sangam MN","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:26px;margin:0;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.summary{background:var(--acc);color:var(--accTx);border-radius:18px;padding:16px;margin-bottom:14px}
.summary .lbl{opacity:.85;font-size:13px}
.summary .big{font-size:26px;font-weight:700;margin:2px 0 6px}
.summary .row{display:flex;gap:16px;font-size:13px;opacity:.95;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;border:0;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.mid{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:13px}
.badge{flex:none;text-align:center;border-radius:12px;padding:6px 9px;min-width:64px;font-size:12px;line-height:1.2}
.badge b{display:block;font-size:18px}
.b-red{background:var(--redBg);color:var(--red)}.b-org{background:var(--orgBg);color:var(--org)}
.b-yel{background:var(--yelBg);color:var(--yel)}.b-grn{background:var(--grnBg);color:var(--grn)}
.b-mut{background:var(--soft);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:60px;height:60px;border-radius:20px;border:0;background:var(--acc);color:var(--accTx);font-size:32px;box-shadow:0 8px 24px rgba(79,70,229,.35)}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.hint button{border:0;background:none;color:var(--mut);float:right;font-size:18px;margin:-6px -4px 0 0}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font-size:20px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;appearance:none;-webkit-appearance:none}
.fld input[type=date]{min-height:46px}
.two{display:flex;gap:10px}.two>.fld{flex:1}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--tx)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;margin-top:8px;background:var(--card);color:var(--tx)}
.btn.pri{background:var(--acc);color:var(--accTx)}
.btn.dan{color:var(--red)}
.btn.grn{background:var(--grnBg);color:var(--grn)}
.detail-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.kv{background:var(--card);border-radius:14px;padding:4px 12px;margin-bottom:8px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{text-align:right}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%}
.toast.show{opacity:1}
.small{font-size:13px;color:var(--mut)}
.conf{background:var(--redBg);color:var(--red);border-radius:14px;padding:12px;margin-top:8px;font-size:14px}
</style>
</head>
<body>

<div class="top">
  <h1>সাবস্ক্রিপশন</h1>
  <button class="iconbtn" id="menuBtn" aria-label="মেনু">⋯</button>
</div>

<div id="installHint"></div>
<div class="summary" id="summary"></div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>

<button class="fab" id="addBtn" aria-label="নতুন যোগ করুন">+</button>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
const KEY='subs.v1';
const COLORS=['#E50914','#00A8E1','#FA2D48','#D97757','#10A37F','#4285F4','#6366F1','#0EA5E9','#F59E0B','#8B5CF6','#64748B','#1DB954'];
const PRESETS=[
  ['Netflix','#E50914','month'],['Prime Video','#00A8E1','month'],['Apple Music','#FA2D48','month'],
  ['Claude','#D97757','month'],['ChatGPT','#10A37F','month'],['Gemini','#4285F4','month'],
  ['DNS সার্ভার','#6366F1','year'],['iCloud+','#0EA5E9','month'],['YouTube Premium','#F59E0B','month'],['Spotify','#1DB954','month']
];
const CYCLE={month:'মাসিক',year:'বার্ষিক',week:'সাপ্তাহিক',custom:'কাস্টম',once:'একবারই (রিনিউ নেই)'};
const CUR=['€','$','৳','£'];

let subs=load();
let filter='all';
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(subs))}catch(e){toast('⚠️ সেভ করা যায়নি')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function daysLeft(s){return Math.round((parseD(s)-today())/86400000)}
function addCycle(s,cycle,n){
  const d=parseD(s);
  if(cycle==='month'||cycle==='year'){
    const add=cycle==='year'?12:1,day=d.getDate();
    const t=new Date(d.getFullYear(),d.getMonth()+add,1);
    const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    t.setDate(Math.min(day,last));return iso(t);
  }
  d.setDate(d.getDate()+(cycle==='week'?7:Math.max(1,+n||30)));return iso(d);
}
const bnNum=n=>Number(n).toLocaleString('bn-BD');
function bnDate(s){try{return parseD(s).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function money(p,c){if(p===''||p==null||isNaN(p))return'—';return c+Number(p).toFixed(2)}
function monthly(s){
  const p=+s.price;if(!p||s.cycle==='once')return 0;
  if(s.cycle==='month')return p;if(s.cycle==='year')return p/12;
  if(s.cycle==='week')return p*52/12;return p*30.4375/Math.max(1,+s.days||30);
}
function cycleText(s){return s.cycle==='custom'?bnNum(s.days||30)+' দিন পর পর':CYCLE[s.cycle]}

/* auto-renewing subs roll forward by themselves */
function rollForward(){
  let changed=false;
  subs.forEach(s=>{
    if(s.auto&&s.cycle!=='once'){let g=0;while(daysLeft(s.date)<0&&g++<600){s.date=addCycle(s.date,s.cycle,s.days);changed=true}}
  });
  if(changed)save();
}

function status(s){
  const d=daysLeft(s.date),r=+s.remind||0;
  if(d<0)return{cls:'b-red',big:'শেষ',small:bnNum(-d)+' দিন আগে'};
  if(d===0)return{cls:'b-red',big:'আজ',small:s.auto?'কাটবে':'মেয়াদ শেষ'};
  if(d===1)return{cls:'b-org',big:'কাল',small:'বাকি'};
  if(d<=Math.max(r,3))return{cls:'b-org',big:bnNum(d),small:'দিন বাকি'};
  if(d<=7)return{cls:'b-yel',big:bnNum(d),small:'দিন বাকি'};
  return{cls:'b-grn',big:bnNum(d),small:'দিন বাকি'};
}

const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(n){const w=String(n).trim().split(/\s+/);const a=Array.from(w[0]||'?')[0],b=w[1]?Array.from(w[1])[0]:'';return(a+(/[A-Za-z0-9]/.test(a)&&/[A-Za-z0-9+]/.test(b)?b:'')).toUpperCase()}

/* ---------- render ---------- */
function render(){
  rollForward();
  const sorted=[...subs].sort((a,b)=>daysLeft(a.date)-daysLeft(b.date));
  // summary
  const tot={};subs.forEach(s=>{const m=monthly(s);if(m)tot[s.cur]=(tot[s.cur]||0)+m});
  const keys=Object.keys(tot);
  const soon=subs.filter(s=>{const d=daysLeft(s.date);return d>=0&&d<=7}).length;
  const exp=subs.filter(s=>daysLeft(s.date)<0).length;
  $('summary').innerHTML=
    '<div class="lbl">মাসিক আনুমানিক খরচ</div>'+
    '<div class="big">'+(keys.length?keys.map(c=>money(tot[c],c)).join(' + '):'—')+'</div>'+
    '<div class="row"><span>বছরে: '+(keys.length?keys.map(c=>money(tot[c]*12,c)).join(' + '):'—')+'</span>'+
    '<span>মোট: '+bnNum(subs.length)+'টি</span><span>৭ দিনে: '+bnNum(soon)+'টি</span>'+(exp?'<span>মেয়াদ শেষ: '+bnNum(exp)+'টি</span>':'')+'</div>';
  // chips
  const ch=[['all','সব ('+bnNum(subs.length)+')'],['soon','৭ দিনের মধ্যে ('+bnNum(soon)+')'],['exp','মেয়াদ শেষ ('+bnNum(exp)+')']];
  $('chips').innerHTML=ch.map(c=>'<button class="chip'+(filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('');
  // list
  let rows=sorted;
  if(filter==='soon')rows=rows.filter(s=>{const d=daysLeft(s.date);return d>=0&&d<=7});
  if(filter==='exp')rows=rows.filter(s=>daysLeft(s.date)<0);
  if(!subs.length){$('list').innerHTML='<div class="empty">এখনো কোনো সাবস্ক্রিপশন নেই।<br>নিচের <b>+</b> চাপে যোগ করুন।</div>';return}
  if(!rows.length){$('list').innerHTML='<div class="empty">এই তালিকায় কিছু নেই ✅</div>';return}
  $('list').innerHTML=rows.map(s=>{const st=status(s);
    return '<button class="item" data-id="'+s.id+'">'+
      '<div class="av" style="background:'+esc(s.color)+'">'+esc(initials(s.name))+'</div>'+
      '<div class="mid"><div class="nm">'+esc(s.name)+'</div>'+
      '<div class="sub">'+bnDate(s.date)+'</div>'+
      '<div class="sub">'+money(s.price,s.cur)+' · '+cycleText(s)+(s.auto?'':' · ✋ নিজে রিনিউ')+'</div></div>'+
      '<div class="badge '+st.cls+'"><b>'+st.big+'</b>'+st.small+'</div></button>';
  }).join('');
}

/* ---------- sheet ---------- */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('ov').classList.add('show');$('sheet').scrollTop=0}
function closeSheet(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------- form ---------- */
function form(s){
  const isNew=!s;
  s=s||{id:'',name:'',price:'',cur:'€',cycle:'month',days:30,date:iso(today()),auto:true,remind:3,pay:'',note:'',color:COLORS[6]};
  openSheet(
    '<h2>'+(isNew?'নতুন সাবস্ক্রিপশন':'এডিট করুন')+'</h2>'+
    (isNew?'<div class="small" style="margin-bottom:6px">দ্রুত বেছে নিন:</div><div class="presets">'+PRESETS.map((p,i)=>'<button type="button" data-p="'+i+'">'+esc(p[0])+'</button>').join('')+'</div>':'')+
    '<form id="f">'+
    '<div class="fld"><label>নাম</label><input id="fName" required value="'+esc(s.name)+'" placeholder="যেমন: Netflix"></div>'+
    '<div class="two"><div class="fld"><label>দাম</label><input id="fPrice" inputmode="decimal" value="'+esc(s.price)+'" placeholder="0.00"></div>'+
    '<div class="fld" style="flex:0 0 90px"><label>মুদ্রা</label><select id="fCur">'+CUR.map(c=>'<option'+(c===s.cur?' selected':'')+'>'+c+'</option>').join('')+'</select></div></div>'+
    '<div class="two"><div class="fld"><label>কত দিন পর পর</label><select id="fCycle">'+Object.keys(CYCLE).map(k=>'<option value="'+k+'"'+(k===s.cycle?' selected':'')+'>'+CYCLE[k]+'</option>').join('')+'</select></div>'+
    '<div class="fld" id="daysWrap" style="flex:0 0 110px;'+(s.cycle==='custom'?'':'display:none')+'"><label>দিন</label><input id="fDays" type="number" inputmode="numeric" min="1" value="'+esc(s.days||30)+'"></div></div>'+
    '<div class="fld"><label>পরের পেমেন্ট / মেয়াদ শেষের তারিখ</label><input id="fDate" type="date" required value="'+esc(s.date)+'"></div>'+
    '<label class="sw"><span>অটো রিনিউ হয় (কার্ড থেকে নিজে কাটে)</span><input id="fAuto" type="checkbox"'+(s.auto?' checked':'')+'></label>'+
    '<div class="fld"><label>কত দিন আগে সতর্ক করবে</label><select id="fRemind">'+[0,1,2,3,5,7,14,30].map(n=>'<option value="'+n+'"'+(+s.remind===n?' selected':'')+'>'+(n?bnNum(n)+' দিন আগে':'ঐ দিনই')+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>পেমেন্ট মাধ্যম (ঐচ্ছিক)</label><input id="fPay" value="'+esc(s.pay)+'" placeholder="যেমন: Visa শেষ ৪ সংখ্যা, PayPal, Apple ID"></div>'+
    '<div class="fld"><label>নোট (ঐচ্ছিক)</label><textarea id="fNote" rows="2" placeholder="যেমন: কোন ইমেইলে অ্যাকাউন্ট">'+esc(s.note)+'</textarea></div>'+
    '<div class="fld"><label>রং</label><div class="colors" id="fColors">'+COLORS.map(c=>'<button type="button" data-c="'+c+'" style="background:'+c+'"'+(c===s.color?' class="on"':'')+'></button>').join('')+'</div></div>'+
    '<button class="btn pri" type="submit">সেভ করুন</button>'+
    '<button class="btn" type="button" id="fCancel">বাতিল</button>'+
    '</form>'
  );
  let color=s.color;
  const sh=$('sheet');
  sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.p];$('fName').value=p[0];color=p[1];$('fCycle').value=p[2];$('daysWrap').style.display='none';
    sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x.dataset.c===color));$('fPrice').focus()});
  sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
  $('fCycle').onchange=e=>{$('daysWrap').style.display=e.target.value==='custom'?'':'none'};
  $('fCancel').onclick=closeSheet;
  $('f').onsubmit=e=>{
    e.preventDefault();
    const name=$('fName').value.trim(),date=$('fDate').value;
    if(!name){toast('নাম লিখুন');return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('তারিখ দিন');return}
    const pr=$('fPrice').value.replace(',','.').trim();
    const o={id:s.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name,price:pr===''?'':(isNaN(+pr)?'':+pr),
      cur:$('fCur').value,cycle:$('fCycle').value,days:Math.max(1,parseInt($('fDays').value)||30),date,
      auto:$('fAuto').checked,remind:+$('fRemind').value,pay:$('fPay').value.trim(),note:$('fNote').value.trim(),color};
    const i=subs.findIndex(x=>x.id===o.id);if(i>=0)subs[i]=o;else subs.push(o);
    save();closeSheet();render();toast('✅ সেভ হয়েছে');
  };
}

/* ---------- detail ---------- */
function detail(id){
  const s=subs.find(x=>x.id===id);if(!s)return;
  const st=status(s),d=daysLeft(s.date);
  openSheet(
    '<div class="detail-head"><div class="av" style="background:'+esc(s.color)+'">'+esc(initials(s.name))+'</div>'+
    '<div style="flex:1"><h2 style="margin:0">'+esc(s.name)+'</h2><div class="small">'+cycleText(s)+'</div></div>'+
    '<div class="badge '+st.cls+'"><b>'+st.big+'</b>'+st.small+'</div></div>'+
    '<div class="kv">'+
      '<div><span>'+(s.auto?'পরের পেমেন্ট':'মেয়াদ শেষ')+'</span><span>'+bnDate(s.date)+'</span></div>'+
      '<div><span>দাম</span><span>'+money(s.price,s.cur)+'</span></div>'+
      (monthly(s)&&s.cycle!=='month'?'<div><span>মাসে আনুমানিক</span><span>'+money(monthly(s),s.cur)+'</span></div>':'')+
      '<div><span>রিনিউ</span><span>'+(s.auto?'অটো':'নিজে করতে হবে')+'</span></div>'+
      '<div><span>সতর্কতা</span><span>'+(+s.remind?bnNum(s.remind)+' দিন আগে':'ঐ দিনই')+'</span></div>'+
      (s.pay?'<div><span>পেমেন্ট</span><span>'+esc(s.pay)+'</span></div>':'')+
      (s.note?'<div><span>নোট</span><span>'+esc(s.note)+'</span></div>':'')+
    '</div>'+
    (s.cycle!=='once'?'<button class="btn grn" id="dRenew">✅ রিনিউ করেছি → পরের তারিখ '+bnDate(addCycle(s.date,s.cycle,s.days))+'</button>':'')+
    '<button class="btn" id="dCal">📅 আইফোন ক্যালেন্ডারে রিমাইন্ডার যোগ করুন</button>'+
    '<button class="btn" id="dEdit">✏️ এডিট</button>'+
    '<button class="btn dan" id="dDel">🗑 মুছে ফেলুন</button>'+
    '<div id="dConf"></div>'+
    '<button class="btn" id="dClose">বন্ধ</button>'
  );
  if($('dRenew'))$('dRenew').onclick=()=>{
    // if already well past, jump from today's side
    s.date=addCycle(s.date,s.cycle,s.days);
    save();closeSheet();render();toast('পরের তারিখ: '+bnDate(s.date));
  };
  $('dCal').onclick=()=>downloadICS([s],'reminder-'+s.name.replace(/[^\w]+/g,'-')+'.ics');
  $('dEdit').onclick=()=>form(s);
  $('dClose').onclick=closeSheet;
  $('dDel').onclick=()=>{
    $('dConf').innerHTML='<div class="conf">সত্যিই "'+esc(s.name)+'" মুছবেন?<button class="btn dan" id="dYes" style="background:var(--card)">হ্যাঁ, মুছে দিন</button></div>';
    $('dYes').onclick=()=>{subs=subs.filter(x=>x.id!==s.id);save();closeSheet();render();toast('মুছে ফেলা হয়েছে')};
  };
}

/* ---------- calendar (.ics) ---------- */
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function buildICS(list){
  const now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Amar Subscription//BN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(s=>{
    const start=s.date.replace(/-/g,''),end=addCycle(s.date,'custom',1).replace(/-/g,'');
    const rr={month:'FREQ=MONTHLY',year:'FREQ=YEARLY',week:'FREQ=WEEKLY',custom:'FREQ=DAILY;INTERVAL='+Math.max(1,+s.days||30)}[s.cycle];
    const r=+s.remind||0;
    const title=s.name+(s.auto?' – পেমেন্ট':' – মেয়াদ শেষ')+(s.price!==''?' ('+money(s.price,s.cur)+')':'');
    L.push('BEGIN:VEVENT','UID:'+s.id+'@amar-subs','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,
      'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc((s.pay?'পেমেন্ট: '+s.pay+'\n':'')+(s.note||'')),'TRANSP:TRANSPARENT');
    if(rr&&s.cycle!=='once')L.push('RRULE:'+rr);
    // alarm at 09:00 X days before, and 09:00 on the day
    if(r>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(s.name+' – '+r+' দিন বাকি'),'TRIGGER:-P'+(r-1)+'DT15H','END:VALARM');
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(s.name+' – আজ'),'TRIGGER:PT9H','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadICS(list,name){
  if(!list.length){toast('কিছু নেই');return}
  const blob=new Blob([buildICS(list)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  toast('খুললে "Add to Calendar" চাপুন');
}

/* ---------- backup ---------- */
async function shareOrDownload(text,name,type){
  const blob=new Blob([text],{type});
  try{const f=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
function menu(){
  openSheet(
    '<h2>মেনু</h2>'+
    '<button class="btn" id="mCal">📅 সবগুলো একসাথে ক্যালেন্ডারে যোগ করুন</button>'+
    '<button class="btn" id="mExp">💾 ব্যাকআপ নিন (ফাইল)</button>'+
    '<button class="btn" id="mCopy">📋 ব্যাকআপ কপি করুন (টেক্সট)</button>'+
    '<button class="btn" id="mImp">📂 ব্যাকআপ থেকে ফেরত আনুন</button>'+
    '<div id="mConf"></div>'+
    '<p class="small" style="margin-top:14px">সব তথ্য শুধু এই ফোনেই থাকে — কোনো সার্ভারে যায় না, ইন্টারনেট লাগে না। হোম স্ক্রিন থেকে অ্যাপটা মুছে দিলে তথ্যও মুছে যাবে, তাই মাঝে মাঝে ব্যাকআপ নিয়ে Files বা iCloud Drive-এ রাখুন।</p>'+
    '<button class="btn" id="mClose">বন্ধ</button>'
  );
  $('mClose').onclick=closeSheet;
  $('mCal').onclick=()=>downloadICS(subs,'subscriptions.ics');
  const payload=()=>JSON.stringify({app:'amar-subs',v:1,exported:new Date().toISOString(),subs},null,1);
  $('mExp').onclick=async()=>{if(await shareOrDownload(payload(),'subscriptions-backup-'+iso(today())+'.json','application/json'))toast('ব্যাকআপ তৈরি হয়েছে')};
  $('mCopy').onclick=async()=>{try{await navigator.clipboard.writeText(payload());toast('কপি হয়েছে — Notes-এ পেস্ট করে রাখুন')}catch(e){toast('কপি করা যায়নি')}};
  $('mImp').onclick=()=>$('fileIn').click();
}
$('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let data;try{data=JSON.parse(rd.result)}catch(_){toast('ফাইলটা সঠিক নয়');return}
    const arr=Array.isArray(data)?data:data&&data.subs;
    if(!Array.isArray(arr)||arr.some(x=>!x||!x.name||!/^\d{4}-\d{2}-\d{2}$/.test(x.date))){toast('ফাইলটা সঠিক নয়');return}
    const box=$('mConf');
    if(!box){subs=arr;save();render();toast('ফেরত আনা হয়েছে');return}
    box.innerHTML='<div class="conf">ফাইলে '+bnNum(arr.length)+'টি আছে। এখনকার '+bnNum(subs.length)+'টির জায়গায় বসবে।'+
      '<button class="btn" id="iRep" style="background:var(--card)">হ্যাঁ, বদলে দিন</button>'+
      '<button class="btn" id="iMerge" style="background:var(--card)">না, একসাথে যোগ করুন</button></div>';
    $('iRep').onclick=()=>{subs=arr;save();closeSheet();render();toast('ফেরত আনা হয়েছে')};
    $('iMerge').onclick=()=>{const ids=new Set(subs.map(x=>x.id));arr.forEach(x=>{if(!ids.has(x.id))subs.push(x)});save();closeSheet();render();toast('যোগ হয়েছে')};
  };
  rd.readAsText(f);
});

/* ---------- events ---------- */
$('addBtn').onclick=()=>form(null);
$('menuBtn').onclick=menu;
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}});
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

/* install hint (iPhone Safari, not yet installed) */
const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
let hideHint=false;try{hideHint=localStorage.getItem('subs.hint')==='x'}catch(e){}
if(!standalone&&!hideHint&&/iPhone|iPad|iPod/.test(navigator.userAgent)){
  $('installHint').innerHTML='<div class="hint"><button id="hx">×</button>📲 ইনস্টল করতে: নিচে <b>শেয়ার</b> বাটন (⬆️) → <b>Add to Home Screen</b> চাপুন।</div>';
  $('hx').onclick=()=>{$('installHint').innerHTML='';try{localStorage.setItem('subs.hint','x')}catch(e){}};
}

/* offline support */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

render();
})();
</script>
